{% extends "base.html" %}

    {% block title %}تغییر متن سوال{% endblock %}

    {% block content %}
    <a class="blue-button" href="{{url_for('teachers.questions', id=exam_id)}}">بازگشت</a>
<form action="" dir="auto" method="post">
        {{ form.csrf_token }}
        {{ form.title.label }}: {{ form.title }}
        <input type="submit" value="ثبت تغییرات" class="green-button"/>
</form>
    <div>
    <h2>گزینه ها</h2>
        {% for choice in choices %}
            <p>{{ choice.text }}
            </p>
        {% endfor %}
    </div>
    {% endblock %}
