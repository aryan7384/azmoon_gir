{% extends "base.html" %}

    {% block title %}ثیت گزینه جدید{% endblock %}

    {% block content %}
<a href="{{url_for('teachers.questions', id=exam_id)}}" class="blue-button" >بازگشت</a>
<form action="" dir="auto" method="POST" novalidate="novalidate">
    {{ form.csrf_token }}
    {{ form.text.label }}: {{ form.text }}
    <br/>
    {{ form.is_correct.label }}: {{ form.is_correct }}
    <br/>
<input type="submit" value="ثبت گزینه" class="green-button"/>
</form>
    {% endblock %}
